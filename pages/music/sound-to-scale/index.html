<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>听音识阶 - 光阴的游乐场</title>
</head>
<body>
    <div class="container">
        <a href="../../settings/" class="settings-link" title="设置">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="12" cy="12" r="3"></circle>
                <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
            </svg>
        </a>

        <header>
            <h1>听音识阶</h1>
            <nav>
                <ul>
                    <li><a href="../../../index.html#music">← 返回</a></li>
                    <li><a href="../">音乐练习</a></li>
                    <li><a href="#" class="active">听音识阶</a></li>
                </ul>
            </nav>
        </header>

        <main class="sound-scale-page">
            <section class="detector-toolbar" aria-label="听音识阶控制">
                <button id="start-listening" class="primary-action" type="button">开始监听</button>
                <button id="stop-listening" type="button" disabled>停止</button>
                <button id="clear-sequence" type="button">清空</button>
                <button id="copy-sequence" type="button">复制</button>
                <label class="sensitivity-control" for="sensitivity-slider">
                    <span>灵敏度</span>
                    <input id="sensitivity-slider" type="range" min="0.01" max="0.08" step="0.005" value="0.025">
                </label>
            </section>

            <section class="detector-grid">
                <div class="detector-panel current-note-panel">
                    <div class="panel-label">当前音高</div>
                    <div id="current-note" class="current-note">--</div>
                    <div id="current-frequency" class="frequency-readout">-- Hz</div>
                    <div class="cents-meter" aria-hidden="true">
                        <span>-50</span>
                        <div class="cents-track">
                            <div id="cents-needle" class="cents-needle"></div>
                        </div>
                        <span>+50</span>
                    </div>
                    <div id="cents-readout" class="secondary-readout">偏差 -- cents</div>
                </div>

                <div class="detector-panel signal-panel">
                    <div class="panel-label">输入信号</div>
                    <div class="signal-meter">
                        <div id="signal-fill" class="signal-fill"></div>
                    </div>
                    <div class="metric-row">
                        <span>置信度</span>
                        <strong id="confidence-value">--</strong>
                    </div>
                    <div class="metric-row">
                        <span>状态</span>
                        <strong id="detector-status">未监听</strong>
                    </div>
                </div>
            </section>

            <section class="transcription-grid">
                <div class="detector-panel sequence-panel">
                    <div class="panel-header">
                        <h2>音符序列</h2>
                        <button id="remove-last" type="button">撤销</button>
                    </div>
                    <div id="note-sequence" class="note-sequence empty">等待输入</div>
                    <div class="notation-block">
                        <span>音级</span>
                        <strong id="degree-sequence">--</strong>
                    </div>
                </div>

                <div class="detector-panel scale-panel">
                    <h2>音阶候选</h2>
                    <div id="scale-candidates" class="scale-candidates empty">等待更多音符</div>
                </div>
            </section>
        </main>

        <footer>
            <p>&copy; 2023 光阴的游乐场</p>
        </footer>
    </div>

    <script type="module" src="./main.js"></script>
</body>
</html>
