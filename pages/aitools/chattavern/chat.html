<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ChatTavern - 对话</title>
</head>
<body>
    <div class="chat-container">
        <header class="chat-header">
            <a href="chattavern.html" class="back-btn">← 返回</a>
            <h2 id="characterName">角色名称</h2>
            <a href="../../../index.html" class="back-btn" title="返回主页">🏠</a>
            <a href="../../settings/#ai-settings-tab" class="btn-menu" title="AI设置">⚙</a>
        </header>

        <main class="chat-main">
            <div id="messageList" class="message-list">
                <!-- 消息将动态添加到这里 -->
            </div>
        </main>

        <footer class="chat-footer">
            <div class="input-wrapper">
                <textarea id="messageInput" placeholder="输入消息..." rows="1"></textarea>
                <button id="sendBtn" class="btn-send">发送</button>
            </div>
        </footer>
    </div>

    <script type="module" src="./chat.js"></script>
</body>
</html>
