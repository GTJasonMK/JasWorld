<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>思绪对谈 - 智慧的问答</title>
</head>
<body>
    <div class="chat-container">
        <!-- 顶部导航栏 -->
        <header class="chat-header">
            <div class="header-left">
                <button class="btn-menu" id="menuButton" title="菜单">☰</button>
                <a class="btn-back" href="../../../index.html#aitools">← 返回</a>
                <button class="btn-new-chat" id="newChatButton" title="新对话">+ 新的对话</button>
                <h1>🤖 思绪对谈</h1>
            </div>
            <div class="header-right">
                <a class="btn-icon" href="../../settings/#ai-settings-tab" title="AI设置">⚙️</a>
                <button class="btn-icon" id="clearChat" title="清空对话">🗑️</button>
            </div>
        </header>

        <!-- 移动端遮罩层 -->
        <div class="sidebar-overlay" id="sidebarOverlay"></div>

        <div class="chat-main">
            <!-- 统一侧边栏（对话历史 + 设置） -->
            <aside class="sidebar" id="sidebar">
            <div class="sidebar-header">
                <div class="sidebar-tabs">
                    <button class="tab-btn active" data-tab="history">对话历史</button>
                </div>
                <button class="btn-icon btn-close-sidebar" id="closeSidebar" title="关闭">✕</button>
            </div>

            <div class="sidebar-content">
                <!-- 对话历史面板 -->
                <div class="tab-panel active" id="historyPanel">
                    <div class="sessions-list" id="sessionsList">
                        <!-- 会话列表将通过JavaScript动态填充 -->
                    </div>
                </div>

            </div>
        </aside>

            <!-- 右侧聊天区域 -->
            <main class="chat-area">
                <!-- 消息列表 -->
                <div class="messages-container" id="messagesContainer">
                    <div class="welcome-message">
                        <h2>👋 欢迎进入思绪的空间</h2>
                        <p>在这里，每个问题都值得被倾听，每份困惑都能得到解答</p>
                        <div class="quick-tips">
                            <h4>💡 开始对话：</h4>
                            <ul>
                                <li>点击右上角设置按钮，在个人偏好中配置AI服务</li>
                                <li>支持New API、OpenAI、DeepSeek等服务</li>
                                <li>只需填写base URL，系统会自动补全</li>
                                <li>对话会被妥善保存在本地</li>
                                <li>支持连贯的多轮对话</li>
                            </ul>
                        </div>
                    </div>
                </div>

                <!-- 输入区域 -->
                <div class="input-area">
                    <div class="input-wrapper">
                        <textarea id="messageInput" class="message-input"
                                  placeholder="说出你的想法...（Shift+Enter换行，Enter发送）"
                                  rows="1"></textarea>
                        <button class="btn-send" id="sendButton">
                            <span class="send-icon">📤</span>
                            <span class="send-text">发送</span>
                        </button>
                    </div>
                    <div class="input-status" id="inputStatus"></div>
                </div>
            </main>
        </div>
    </div>

    <!-- 加载脚本 -->
    <script type="module" src="./chat.js"></script>
</body>
</html>
